<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArzPulse – قیمت‌های لحظه‌ای نوبیتکس</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            color: #fff;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 40%, #24243e 70%, #1a1a2e 100%);
            position: relative;
        }

        /* ===== BACKGROUND PARTICLES ===== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== GLASS CONTAINER ===== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 28px 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 40px 80px -16px rgba(0, 0, 0, 0.8);
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
        }
        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to right, #f6d365, #fda085);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .currency-toggle {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 100px;
            padding: 4px;
            display: flex;
            gap: 4px;
        }
        .currency-toggle button {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            padding: 6px 18px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .currency-toggle button.active {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.1);
        }
        .currency-toggle button:hover:not(.active) {
            color: rgba(255, 255, 255, 0.7);
        }
        .badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.25);
            color: #6ee7b7;
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: pulse-badge 2s infinite;
        }
        .badge-dot {
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.2s infinite;
        }
        @keyframes pulse-badge {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        /* ===== TOP CARDS (Gold & Dollar) ===== */
        .top-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 28px;
        }
        .top-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 18px 22px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }
        .top-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }
        .top-card.gold {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.12), rgba(245, 158, 11, 0.04));
            border-color: rgba(251, 191, 36, 0.2);
        }
        .top-card.dollar {
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.08), rgba(16, 185, 129, 0.03));
            border-color: rgba(52, 211, 153, 0.15);
        }
        .top-card .label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .top-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 4px;
        }
        .top-card.gold .value {
            color: #fbbf24;
        }
        .top-card.dollar .value {
            color: #6ee7b7;
        }
        .top-card .sub {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 2px;
        }

        /* ===== PRICE GRID ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .price-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 18px 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
        }
        .price-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.5);
        }
        .price-card .symbol-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .price-card .symbol {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .price-card .change {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 100px;
        }
        .change.up {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }
        .change.down {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
        .change.neutral {
            background: rgba(255, 255, 255, 0.06);
            color: #9ca3af;
        }
        .price-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 12px;
            margin-top: 6px;
        }
        .price-details .row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
        }
        .price-details .row .label {
            color: rgba(255, 255, 255, 0.35);
        }
        .price-details .row .value.buy {
            color: #6ee7b7;
        }
        .price-details .row .value.sell {
            color: #fca5a5;
        }
        .price-details .row .value.last {
            color: #fff;
            font-weight: 600;
        }
        .price-details .row .value.high {
            color: #34d399;
        }
        .price-details .row .value.low {
            color: #f87171;
        }
        .price-details .row .value.volume {
            color: #93c5fd;
        }
        .last-price {
            margin-top: 10px;
            text-align: left;
            font-size: 1.2rem;
            font-weight: 700;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 8px;
        }
        .last-price .unit {
            font-size: 0.65rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.3);
            margin-right: 4px;
        }

        /* ===== CHART SECTION ===== */
        .chart-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 18px 18px 8px 18px;
            margin-bottom: 20px;
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
            gap: 10px;
        }
        .chart-title {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-controls {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .chart-controls button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
            padding: 3px 14px;
            border-radius: 100px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .chart-controls button:hover,
        .chart-controls button.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.15);
        }
        .chart-controls button.active {
            background: rgba(251, 191, 36, 0.15);
            border-color: rgba(251, 191, 36, 0.25);
            color: #fbbf24;
        }
        .chart-wrapper {
            position: relative;
            height: 260px;
            width: 100%;
        }
        .chart-wrapper canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* ===== STATUS & FOOTER ===== */
        .status {
            margin-top: 8px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.25);
            text-align: center;
        }
        .status.error {
            color: #f87171;
        }
        .status.warning {
            color: #fbbf24;
        }
        .footer {
            margin-top: 18px;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 14px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .footer a {
            color: rgba(255, 255, 255, 0.25);
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer a:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .container {
                padding: 16px;
                border-radius: 32px;
            }
            .logo {
                font-size: 1.6rem;
            }
            .top-cards {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .top-card .value {
                font-size: 1.4rem;
            }
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .price-details {
                grid-template-columns: 1fr;
                gap: 2px;
            }
            .chart-wrapper {
                height: 180px;
            }
            .chart-header {
                flex-direction: column;
                align-items: stretch;
            }
            .chart-controls {
                justify-content: center;
            }
            .currency-toggle button {
                padding: 4px 12px;
                font-size: 0.7rem;
            }
        }
        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .header-controls {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND PARTICLES -->
    <canvas id="particles-canvas"></canvas>

    <!-- MAIN CONTAINER -->
    <div class="container" id="app">

        <!-- HEADER -->
        <div class="header">
            <div class="logo">✨ ArzPulse</div>
            <div class="header-controls">
                <div class="currency-toggle" id="currencyToggle">
                    <button class="active" data-currency="IRR">ریال</button>
                    <button data-currency="USD">دلار</button>
                </div>
                <div class="badge">
                    <span class="badge-dot"></span>
                    <span id="liveStatus">زنده</span>
                </div>
            </div>
        </div>

        <!-- TOP CARDS: GOLD & DOLLAR -->
        <div class="top-cards">
            <div class="top-card gold">
                <div class="label">🏆 هر گرم طلای ۱۸ عیار</div>
                <div class="value" id="goldPrice">–</div>
                <div class="sub" id="goldSub">نرخ تتر: –</div>
            </div>
            <div class="top-card dollar">
                <div class="label">💵 قیمت دلار</div>
                <div class="value" id="dollarPrice">–</div>
                <div class="sub" id="dollarSub">نرخ بازار (USDT)</div>
            </div>
        </div>

        <!-- PRICE GRID -->
        <div class="grid" id="priceGrid"></div>

        <!-- CHART SECTION -->
        <div class="chart-section">
            <div class="chart-header">
                <div class="chart-title">📈 قیمت <span id="chartSymbol">بیت‌کوین</span> (۳۰ روز)</div>
                <div class="chart-controls" id="chartControls">
                    <button data-symbol="BTC" class="active">BTC</button>
                    <button data-symbol="ETH">ETH</button>
                    <button data-symbol="USDT">USDT</button>
                    <button data-symbol="NOT">NOT</button>
                    <button data-symbol="GOLD">طلا</button>
                    <button data-symbol="DOLLAR">دلار</button>
                </div>
            </div>
            <div class="chart-wrapper">
                <canvas id="priceChart"></canvas>
            </div>
        </div>

        <!-- STATUS -->
        <div class="status" id="statusBar">در حال دریافت داده‌ها...</div>

        <!-- FOOTER -->
        <div class="footer">
            <span>📊 <a href="https://nobitex.ir" target="_blank">نوبیتکس</a></span>
            <span>🔄 بروزرسانی هر ۵ دقیقه</span>
            <span>🤖 <a href="https://t.me/ArzPulseBot" target="_blank">ربات تلگرام</a></span>
            <span>📦 <a href="https://github.com/mehrdadmb2/ArzPulse" target="_blank">گیت‌هاب</a></span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ==========================================================
            // تنظیمات
            // ==========================================================
            const basePath = window.location.pathname.includes('/ArzPulse/') ? '/ArzPulse' : '';
            const DATA_URL = `${basePath}/data/latest.json`;
            const HISTORY_BASE = `${basePath}/data/history/`;

            const ASSETS = [
                { symbol: 'BTC', name: 'بیت‌کوین', emoji: '🪙', color: '#f7931a' },
                { symbol: 'ETH', name: 'اتریوم', emoji: '💎', color: '#627eea' },
                { symbol: 'USDT', name: 'تتر', emoji: '💵', color: '#26a17b' },
                { symbol: 'NOT', name: 'نات‌کوین', emoji: '📈', color: '#a855f7' }
            ];

            let currentCurrency = 'IRR';
            let latestData = null;
            let chartInstance = null;
            let currentChartSymbol = 'BTC';
            let fullHistory = [];

            // ==========================================================
            // توابع کمکی
            // ==========================================================
            function formatNumber(num, currency = 'IRR') {
                if (num === undefined || num === null || isNaN(num)) return '۰';
                const val = Math.round(num);
                if (currency === 'USD' && latestData && latestData.dollarPrice) {
                    return (val / latestData.dollarPrice).toFixed(2);
                }
                return val.toLocaleString('fa-IR').replace(/,/g, '،');
            }

            function formatCurrency(num, currency = 'IRR') {
                if (num === undefined || num === null || isNaN(num)) return '–';
                const formatted = formatNumber(num, currency);
                return currency === 'USD' ? `$${formatted}` : `${formatted} ریال`;
            }

            function getChangeEmoji(change) {
                if (change > 0) return '🟢';
                if (change < 0) return '🔴';
                return '⚪';
            }

            function getChangeClass(change) {
                if (change > 0) return 'up';
                if (change < 0) return 'down';
                return 'neutral';
            }

            function getChangeArrow(change) {
                if (change > 0) return '▲';
                if (change < 0) return '▼';
                return '–';
            }

            // ==========================================================
            // ذرات پس‌زمینه
            // ==========================================================
            function initParticles() {
                const canvas = document.getElementById('particles-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let w, h;
                const particles = [];
                const COUNT = 70;

                function resize() {
                    w = canvas.width = window.innerWidth;
                    h = canvas.height = window.innerHeight;
                }
                window.addEventListener('resize', resize);
                resize();

                class Particle {
                    constructor() {
                        this.x = Math.random() * w;
                        this.y = Math.random() * h;
                        this.size = Math.random() * 2 + 0.5;
                        this.speedX = (Math.random() - 0.5) * 0.3;
                        this.speedY = (Math.random() - 0.5) * 0.3;
                        this.opacity = Math.random() * 0.4 + 0.1;
                    }
                    update() {
                        this.x += this.speedX;
                        this.y += this.speedY;
                        if (this.x < 0 || this.x > w) this.speedX *= -1;
                        if (this.y < 0 || this.y > h) this.speedY *= -1;
                    }
                    draw() {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 215, 100, ${this.opacity})`;
                        ctx.fill();
                    }
                }

                for (let i = 0; i < COUNT; i++) {
                    particles.push(new Particle());
                }

                function animate() {
                    ctx.clearRect(0, 0, w, h);
                    particles.forEach(p => { p.update();
                        p.draw(); });
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 120) {
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = `rgba(255, 215, 100, ${0.05 * (1 - dist / 120)})`;
                                ctx.lineWidth = 0.5;
                                ctx.stroke();
                            }
                        }
                    }
                    requestAnimationFrame(animate);
                }
                animate();
            }

            // ==========================================================
            // دریافت داده‌ها
            // ==========================================================
            async function fetchLatestData() {
                try {
                    const res = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    console.log('✅ داده‌های latest دریافت شد:', data);
                    return data;
                } catch (e) {
                    console.error('❌ خطا در fetch latest:', e);
                    return null;
                }
            }

            async function fetchAllHistory() {
                try {
                    const today = new Date().toISOString().split('T')[0];
                    const promises = [];
                    for (let i = 0; i < 30; i++) {
                        const d = new Date();
                        d.setDate(d.getDate() - i);
                        const dateStr = d.toISOString().split('T')[0];
                        const url = `${HISTORY_BASE}${dateStr}.json`;
                        promises.push(
                            fetch(url).then(r => r.ok ? r.json() : null).catch(() => null)
                        );
                    }
                    const results = await Promise.all(promises);
                    let all = [];
                    results.forEach(arr => {
                        if (arr && Array.isArray(arr)) {
                            all = all.concat(arr);
                        }
                    });
                    all.sort((a, b) => new Date(a.time) - new Date(b.time));
                    return all;
                } catch (e) {
                    console.warn('خطا در دریافت تاریخچه:', e);
                    return [];
                }
            }

            // ==========================================================
            // رندر قیمت‌ها
            // ==========================================================
            function renderPrices(data) {
                if (!data || !data.prices) {
                    document.getElementById('statusBar').textContent = '⚠️ داده‌ای در دسترس نیست';
                    document.getElementById('statusBar').className = 'status error';
                    return;
                }

                latestData = data;
                const currency = currentCurrency;
                const usdtPrice = data.usdtPrice || 0;
                const dollarPrice = data.dollarPrice || usdtPrice;

                // طلا
                const gold = data.gold18K || 0;
                document.getElementById('goldPrice').textContent = formatCurrency(gold, currency);
                document.getElementById('goldSub').textContent = `نرخ تتر: ${formatCurrency(usdtPrice, currency)}`;

                // دلار
                document.getElementById('dollarPrice').textContent = formatCurrency(dollarPrice, currency);
                document.getElementById('dollarSub').textContent = `نرخ بازار (USDT)`;

                // کارت‌ها
                const grid = document.getElementById('priceGrid');
                let html = '';
                ASSETS.forEach(a => {
                    const p = data.prices[a.symbol];
                    if (p && p.bestSell > 0) {
                        const change = p.change || 0;
                        const cls = getChangeClass(change);
                        html += `
                            <div class="price-card">
                                <div class="symbol-row">
                                    <span class="symbol">${a.emoji} ${a.symbol}</span>
                                    <span class="change ${cls}">${getChangeEmoji(change)} ${getChangeArrow(change)} ${Math.abs(change).toFixed(2)}%</span>
                                </div>
                                <div class="price-details">
                                    <div class="row"><span class="label">خرید</span><span class="value buy">${formatCurrency(p.bestBuy, currency)}</span></div>
                                    <div class="row"><span class="label">فروش</span><span class="value sell">${formatCurrency(p.bestSell, currency)}</span></div>
                                    <div class="row"><span class="label">بالاترین</span><span class="value high">${formatCurrency(p.high, currency)}</span></div>
                                    <div class="row"><span class="label">پایین‌ترین</span><span class="value low">${formatCurrency(p.low, currency)}</span></div>
                                    <div class="row" style="grid-column: 1 / -1;"><span class="label">حجم (۲۴h)</span><span class="value volume">${p.volume ? p.volume.toFixed(2) : '۰'}</span></div>
                                </div>
                                <div class="last-price">
                                    ${formatNumber(p.lastPrice, currency)} <span class="unit">${currency === 'USD' ? 'USD' : 'ریال'}</span>
                                </div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="price-card" style="opacity:0.4;">
                                <div class="symbol-row">
                                    <span class="symbol">${a.emoji} ${a.symbol}</span>
                                    <span class="change neutral">⏳</span>
                                </div>
                                <div style="text-align:center;padding:20px 0;color:rgba(255,255,255,0.25);font-size:0.8rem;">
                                    داده در دسترس نیست
                                </div>
                            </div>
                        `;
                    }
                });
                grid.innerHTML = html;

                // وضعیت
                const time = data.timestamp ? new Date(data.timestamp).toLocaleString('fa-IR', { timeZone: 'Asia/Tehran' }) :
                    'نامشخص';
                document.getElementById('statusBar').textContent = `✅ آخرین بروزرسانی: ${time}`;
                document.getElementById('statusBar').className = 'status';
                document.getElementById('liveStatus').textContent = 'زنده';
                document.querySelector('.badge-dot').style.background = '#34d399';
            }

            // ==========================================================
            // نمودار
            // ==========================================================
            function updateChart(history, symbol) {
                const canvas = document.getElementById('priceChart');
                if (!canvas) return;

                if (!history || history.length === 0) {
                    history = generateMockHistory(symbol);
                }

                let prices, labels;
                if (symbol === 'GOLD') {
                    prices = history.map(h => h.GOLD18K || 0).filter(p => p > 0);
                    labels = history.map(h => new Date(h.time).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' }));
                } else if (symbol === 'DOLLAR') {
                    prices = history.map(h => h.DOLLAR || h.USDT || 0).filter(p => p > 0);
                    labels = history.map(h => new Date(h.time).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' }));
                } else {
                    prices = history.map(h => h[symbol] || 0).filter(p => p > 0);
                    labels = history.map(h => new Date(h.time).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' }));
                }

                if (prices.length === 0) {
                    prices = [0];
                    labels = ['داده در دسترس نیست'];
                }

                const symbolNames = {
                    BTC: 'بیت‌کوین',
                    ETH: 'اتریوم',
                    USDT: 'تتر',
                    NOT: 'نات‌کوین',
                    GOLD: 'طلا (۱۸ عیار)',
                    DOLLAR: 'دلار'
                };
                document.getElementById('chartSymbol').textContent = symbolNames[symbol] || symbol;

                const colors = {
                    BTC: '#f7931a',
                    ETH: '#627eea',
                    USDT: '#26a17b',
                    NOT: '#a855f7',
                    GOLD: '#fbbf24',
                    DOLLAR: '#34d399'
                };
                const color = colors[symbol] || '#fbbf24';

                if (chartInstance) chartInstance.destroy();

                const ctx = canvas.getContext('2d');
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: symbol,
                            data: prices,
                            borderColor: color,
                            backgroundColor: color + '15',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 1.5,
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const val = context.parsed.y;
                                        return currentCurrency === 'USD' ?
                                            `$${(val / (latestData?.dollarPrice || 1)).toFixed(2)}` :
                                            `${Math.round(val).toLocaleString('fa-IR').replace(/,/g, '،')} ریال`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: 'rgba(255,255,255,0.04)' },
                                ticks: {
                                    color: 'rgba(255,255,255,0.25)',
                                    font: { size: 9 },
                                    maxTicksLimit: 15
                                }
                            },
                            y: {
                                grid: { color: 'rgba(255,255,255,0.04)' },
                                ticks: {
                                    color: 'rgba(255,255,255,0.25)',
                                    font: { size: 9 },
                                    callback: function(value) {
                                        if (currentCurrency === 'USD') {
                                            return `$${(value / (latestData?.dollarPrice || 1)).toFixed(1)}`;
                                        }
                                        return Math.round(value).toLocaleString('fa-IR').replace(/,/g, '،');
                                    }
                                }
                            }
                        }
                    }
                });
            }

            function generateMockHistory(symbol) {
                const data = [];
                const now = Date.now();
                let basePrice = 0;
                switch (symbol) {
                    case 'BTC':
                        basePrice = 6400000000;
                        break;
                    case 'ETH':
                        basePrice = 425000000;
                        break;
                    case 'USDT':
                        basePrice = 58600;
                        break;
                    case 'NOT':
                        basePrice = 855;
                        break;
                    case 'GOLD':
                        basePrice = 12345000;
                        break;
                    case 'DOLLAR':
                        basePrice = 58600;
                        break;
                    default:
                        basePrice = 1000000;
                }
                for (let i = 0; i < 30; i++) {
                    const time = new Date(now - (29 - i) * 24 * 60 * 60 * 1000);
                    const variation = (Math.random() - 0.5) * 0.08;
                    const price = Math.round(basePrice * (1 + variation));
                    const entry = { time: time.toISOString() };
                    if (symbol === 'GOLD') entry.GOLD18K = price;
                    else if (symbol === 'DOLLAR') entry.DOLLAR = price;
                    else entry[symbol] = price;
                    data.push(entry);
                }
                return data;
            }

            // ==========================================================
            // بارگذاری داده‌ها
            // ==========================================================
            async function loadData() {
                const status = document.getElementById('statusBar');
                status.textContent = '⏳ در حال دریافت داده‌ها...';
                status.className = 'status';

                try {
                    const latest = await fetchLatestData();
                    if (latest && latest.prices) {
                        const hasValid = Object.values(latest.prices).some(p => p && p.bestSell > 0);
                        if (hasValid) {
                            renderPrices(latest);
                        } else {
                            status.textContent = '⚠️ داده‌های قیمت نامعتبر';
                            status.className = 'status warning';
                        }
                    } else {
                        status.textContent = '⚠️ داده‌ای دریافت نشد. لطفاً بعداً تلاش کنید.';
                        status.className = 'status error';
                    }

                    const history = await fetchAllHistory();
                    if (history && history.length > 0) {
                        fullHistory = history;
                        updateChart(history, currentChartSymbol);
                    } else {
                        const mock = generateMockHistory(currentChartSymbol);
                        fullHistory = mock;
                        updateChart(mock, currentChartSymbol);
                    }
                } catch (error) {
                    console.error('خطا در بارگذاری:', error);
                    status.textContent = '❌ خطا در دریافت داده‌ها. صفحه را مجدداً بارگذاری کنید.';
                    status.className = 'status error';
                }
            }

            // ==========================================================
            // کنترل‌ها
            // ==========================================================
            function setupCurrencyToggle() {
                const buttons = document.querySelectorAll('#currencyToggle button');
                buttons.forEach(btn => {
                    btn.addEventListener('click', function() {
                        buttons.forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        currentCurrency = this.dataset.currency;
                        if (latestData) renderPrices(latestData);
                        if (fullHistory.length > 0) updateChart(fullHistory, currentChartSymbol);
                        else updateChart(generateMockHistory(currentChartSymbol), currentChartSymbol);
                    });
                });
            }

            function setupChartControls() {
                document.querySelectorAll('#chartControls button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('#chartControls button').forEach(b => b.classList.remove(
                        'active'));
                        this.classList.add('active');
                        currentChartSymbol = this.dataset.symbol;
                        if (fullHistory.length > 0) {
                            updateChart(fullHistory, currentChartSymbol);
                        } else {
                            updateChart(generateMockHistory(currentChartSymbol), currentChartSymbol);
                        }
                    });
                });
            }

            // ==========================================================
            // راه‌اندازی
            // ==========================================================
            initParticles();
            loadData();
            setupCurrencyToggle();
            setupChartControls();
            setInterval(loadData, 5 * 60 * 1000);

            console.log('🚀 ArzPulse Dashboard v2 loaded');
        })();
    </script>

</body>
</html>
