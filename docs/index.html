<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArzPulse – قیمت‌های لحظه‌ای نوبیتکس</title>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* ============================================================
           بک‌گراند داینامیک با ذرات و گرادیان
           ============================================================ */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 40%, #24243e 70%, #1a1a2e 100%);
        }

        /* انیمیشن گرادیان متحرک */
        .bg-gradient::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(251, 191, 36, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 30%, rgba(168, 85, 247, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(16, 185, 129, 0.04) 0%, transparent 40%);
            animation: gradientMove 20s ease-in-out infinite alternate;
        }

        @keyframes gradientMove {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                transform: translate(5%, 5%) rotate(5deg);
            }
        }

        /* ============================================================
           GLASSMORPHISM CONTAINER
           ============================================================ */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1300px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 30px 25px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 0 80px rgba(255, 255, 255, 0.02);
            transition: all 0.3s ease;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
            gap: 12px;
        }
        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(to right, #f6d365, #fda085);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 60px rgba(253, 160, 133, 0.2);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo span {
            font-size: 1.8rem;
        }
        .badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
            padding: 6px 18px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: pulse-badge 2s infinite;
        }
        .badge-dot {
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.2s infinite;
        }

        /* ============================================================
           CARDS: طلا و دلار
           ============================================================ */
        .cards-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 25px;
        }

        .gold-card,
        .dollar-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 18px 22px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }
        .gold-card {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.12), rgba(245, 158, 11, 0.04));
            border-color: rgba(251, 191, 36, 0.2);
        }
        .gold-card:hover {
            border-color: rgba(251, 191, 36, 0.4);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.06);
        }
        .dollar-card {
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.08), rgba(16, 185, 129, 0.03));
            border-color: rgba(52, 211, 153, 0.15);
        }
        .dollar-card:hover {
            border-color: rgba(52, 211, 153, 0.3);
            box-shadow: 0 0 30px rgba(52, 211, 153, 0.06);
        }

        .gold-card .label,
        .dollar-card .label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .gold-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fbbf24;
            text-shadow: 0 0 30px rgba(251, 191, 36, 0.15);
        }
        .dollar-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #6ee7b7;
            text-shadow: 0 0 30px rgba(52, 211, 153, 0.15);
        }
        .gold-card .sub,
        .dollar-card .sub {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
        }

        /* ============================================================
           PRICE GRID
           ============================================================ */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 25px;
        }

        .price-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 16px 16px;
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .price-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.6);
        }
        .price-card .symbol {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .price-card .change {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 100px;
        }
        .change.up {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }
        .change.down {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
        .change.neutral {
            background: rgba(255, 255, 255, 0.06);
            color: #9ca3af;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            font-size: 0.8rem;
        }
        .price-row .label {
            color: rgba(255, 255, 255, 0.4);
        }
        .price-row .value {
            font-weight: 600;
        }
        .price-row .value.buy {
            color: #6ee7b7;
        }
        .price-row .value.sell {
            color: #fca5a5;
        }

        .last-price {
            margin-top: 10px;
            text-align: left;
            font-size: 1.2rem;
            font-weight: 700;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 8px;
        }
        .last-price small {
            font-size: 0.65rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.3);
            margin-right: 4px;
        }

        /* ============================================================
           CHART SECTION
           ============================================================ */
        .chart-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 18px 18px 8px 18px;
            margin-bottom: 20px;
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
            gap: 10px;
        }
        .chart-title {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-controls {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .chart-controls button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
            padding: 3px 14px;
            border-radius: 100px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .chart-controls button:hover,
        .chart-controls button.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.15);
        }
        .chart-controls button.active {
            background: rgba(251, 191, 36, 0.15);
            border-color: rgba(251, 191, 36, 0.25);
            color: #fbbf24;
        }
        .chart-wrapper {
            position: relative;
            height: 250px;
            width: 100%;
        }
        .chart-wrapper canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* ============================================================
           STATUS & FOOTER
           ============================================================ */
        .status {
            margin-top: 8px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.25);
            text-align: center;
        }

        .footer {
            margin-top: 18px;
            text-align: center;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 16px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
        }
        .footer a {
            color: rgba(255, 255, 255, 0.25);
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer a:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        /* ============================================================
           ANIMATIONS
           ============================================================ */
        @keyframes pulse-badge {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 640px) {
            .container {
                padding: 14px;
            }
            .logo {
                font-size: 1.4rem;
            }
            .cards-row {
                grid-template-columns: 1fr;
            }
            .gold-card .value,
            .dollar-card .value {
                font-size: 1.4rem;
            }
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .price-card {
                padding: 12px;
            }
            .last-price {
                font-size: 1rem;
            }
            .chart-wrapper {
                height: 180px;
            }
            .chart-header {
                flex-direction: column;
                align-items: stretch;
            }
            .chart-controls {
                justify-content: center;
            }
        }
        @media (max-width: 420px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- ===== بک‌گراند متحرک ===== -->
    <div class="bg-gradient"></div>
    <canvas id="particles-canvas"></canvas>

    <!-- ===== محتوای اصلی ===== -->
    <div class="container" id="app">
        <!-- HEADER -->
        <div class="header">
            <div class="logo">
                <span>✨</span> ArzPulse
            </div>
            <div class="badge">
                <span class="badge-dot"></span>
                <span id="liveStatus">زنده</span>
            </div>
        </div>

        <!-- CARDS: طلا و دلار -->
        <div class="cards-row">
            <div class="gold-card">
                <div class="label">🏆 هر گرم طلای ۱۸ عیار</div>
                <div class="value" id="goldPrice">–</div>
                <div class="sub" id="goldSub">نرخ تتر: – ریال</div>
            </div>
            <div class="dollar-card">
                <div class="label">💵 قیمت دلار</div>
                <div class="value" id="dollarPrice">–</div>
                <div class="sub" id="dollarSub">نرخ بازار آزاد (USDT)</div>
            </div>
        </div>

        <!-- PRICE GRID -->
        <div class="grid" id="priceGrid">
            <!-- کارت‌ها به‌صورت dynamic پر می‌شوند -->
        </div>

        <!-- CHART SECTION -->
        <div class="chart-section" id="chartSection">
            <div class="chart-header">
                <div class="chart-title">📈 قیمت <span id="chartSymbol">بیت‌کوین</span> (۳۰ روز)</div>
                <div class="chart-controls" id="chartControls">
                    <button data-symbol="BTC" class="active">BTC</button>
                    <button data-symbol="ETH">ETH</button>
                    <button data-symbol="USDT">USDT</button>
                    <button data-symbol="NOT">NOT</button>
                    <button data-symbol="GOLD">طلا</button>
                    <button data-symbol="DOLLAR">دلار</button>
                </div>
            </div>
            <div class="chart-wrapper">
                <canvas id="priceChart"></canvas>
            </div>
        </div>

        <!-- STATUS -->
        <div class="status" id="statusBar">در حال دریافت داده‌ها...</div>

        <!-- FOOTER -->
        <div class="footer">
            <span>📊 داده‌ها از <a href="https://nobitex.ir" target="_blank">نوبیتکس</a></span>
            <span>🔄 بروزرسانی هر ۵ دقیقه</span>
            <span>🤖 <a href="https://t.me/ArzPulseBot" target="_blank">ربات تلگرام</a></span>
            <span>📦 <a href="https://github.com/mehrdadmb2/ArzPulse" target="_blank">گیت‌هاب</a></span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ==========================================================
            // تنظیمات
            // ==========================================================
            const DATA_URL = '/ArzPulse/data/latest.json';
            const HISTORY_BASE = '/ArzPulse/data/history/';

            const ASSETS = [
                { symbol: 'BTC', name: 'بیت‌کوین', emoji: '🪙', color: '#f7931a' },
                { symbol: 'ETH', name: 'اتریوم', emoji: '💎', color: '#627eea' },
                { symbol: 'USDT', name: 'تتر', emoji: '💵', color: '#26a17b' },
                { symbol: 'NOT', name: 'نات‌کوین', emoji: '📈', color: '#a855f7' }
            ];

            let chartInstance = null;
            let currentChartSymbol = 'BTC';
            let fullHistory = [];

            // ==========================================================
            // توابع کمکی
            // ==========================================================
            function formatNumber(num) {
                if (num === undefined || num === null || isNaN(num)) return '۰';
                return Math.round(num).toLocaleString('fa-IR').replace(/,/g, '،');
            }

            function getChangeEmoji(change) {
                if (change > 0) return '🟢';
                if (change < 0) return '🔴';
                return '⚪';
            }

            function getChangeClass(change) {
                if (change > 0) return 'up';
                if (change < 0) return 'down';
                return 'neutral';
            }

            function getChangeArrow(change) {
                if (change > 0) return '▲';
                if (change < 0) return '▼';
                return '–';
            }

            // ==========================================================
            // ذرات بک‌گراند
            // ==========================================================
            function initParticles() {
                const canvas = document.getElementById('particles-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let w, h;
                const particles = [];
                const COUNT = 80;

                function resize() {
                    w = canvas.width = window.innerWidth;
                    h = canvas.height = window.innerHeight;
                }
                window.addEventListener('resize', resize);
                resize();

                class Particle {
                    constructor() {
                        this.x = Math.random() * w;
                        this.y = Math.random() * h;
                        this.size = Math.random() * 2 + 1;
                        this.speedX = (Math.random() - 0.5) * 0.4;
                        this.speedY = (Math.random() - 0.5) * 0.4;
                        this.opacity = Math.random() * 0.5 + 0.2;
                    }
                    update() {
                        this.x += this.speedX;
                        this.y += this.speedY;
                        if (this.x < 0 || this.x > w) this.speedX *= -1;
                        if (this.y < 0 || this.y > h) this.speedY *= -1;
                    }
                    draw() {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 215, 100, ${this.opacity})`;
                        ctx.fill();
                    }
                }

                for (let i = 0; i < COUNT; i++) {
                    particles.push(new Particle());
                }

                function animate() {
                    ctx.clearRect(0, 0, w, h);
                    particles.forEach(p => {
                        p.update();
                        p.draw();
                    });
                    // خطوط بین ذرات نزدیک
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 150) {
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = `rgba(255, 215, 100, ${0.08 * (1 - dist / 150)})`;
                                ctx.lineWidth = 0.6;
                                ctx.stroke();
                            }
                        }
                    }
                    requestAnimationFrame(animate);
                }
                animate();
            }

            // ==========================================================
            // دریافت داده‌ها
            // ==========================================================
            async function fetchLatestData() {
                try {
                    const res = await fetch(DATA_URL + '?t=' + Date.now());
                    if (!res.ok) throw new Error('Network error');
                    return await res.json();
                } catch (e) {
                    console.warn('Failed to fetch latest data:', e);
                    return null;
                }
            }

            async function fetchAllHistory() {
                try {
                    const today = new Date().toISOString().split('T')[0];
                    // دریافت ۳۰ روز اخیر
                    const promises = [];
                    for (let i = 0; i < 30; i++) {
                        const d = new Date();
                        d.setDate(d.getDate() - i);
                        const dateStr = d.toISOString().split('T')[0];
                        const url = `${HISTORY_BASE}${dateStr}.json`;
                        promises.push(
                            fetch(url).then(r => r.ok ? r.json() : null).catch(() => null)
                        );
                    }
                    const results = await Promise.all(promises);
                    // ترکیب همه داده‌ها
                    let all = [];
                    results.forEach(arr => {
                        if (arr && Array.isArray(arr)) {
                            all = all.concat(arr);
                        }
                    });
                    // مرتب‌سازی بر اساس زمان
                    all.sort((a, b) => new Date(a.time) - new Date(b.time));
                    return all;
                } catch (e) {
                    console.warn('Failed to fetch history:', e);
                    return [];
                }
            }

            // ==========================================================
            // رندر کردن کارت‌ها
            // ==========================================================
            function renderPrices(data) {
                const grid = document.getElementById('priceGrid');
                const goldEl = document.getElementById('goldPrice');
                const goldSub = document.getElementById('goldSub');
                const dollarEl = document.getElementById('dollarPrice');
                const dollarSub = document.getElementById('dollarSub');
                const statusEl = document.getElementById('statusBar');
                const liveBadge = document.getElementById('liveStatus');

                if (!data || !data.prices) {
                    statusEl.textContent = '⚠️ داده‌ای در دسترس نیست';
                    statusEl.style.color = 'rgba(239, 68, 68, 0.7)';
                    return;
                }

                const isFallback = data.hasError === true;

                // وضعیت
                if (isFallback) {
                    statusEl.textContent = '⚠️ استفاده از داده‌های ذخیره‌شده (نوبیتکس در دسترس نیست)';
                    statusEl.style.color = 'rgba(251, 191, 36, 0.6)';
                    liveBadge.textContent = 'آفلاین (کش)';
                    document.querySelector('.badge').style.borderColor = 'rgba(251, 191, 36, 0.4)';
                    document.querySelector('.badge-dot').style.background = '#fbbf24';
                } else {
                    const time = data.timestamp ? new Date(data.timestamp).toLocaleString('fa-IR', { timeZone: 'Asia/Tehran' }) :
                        'نامشخص';
                    statusEl.textContent = `✅ آخرین بروزرسانی: ${time}`;
                    statusEl.style.color = 'rgba(255,255,255,0.25)';
                    liveBadge.textContent = 'زنده';
                    document.querySelector('.badge').style.borderColor = 'rgba(16, 185, 129, 0.3)';
                    document.querySelector('.badge-dot').style.background = '#34d399';
                }

                // طلا
                if (data.gold18K > 0) {
                    goldEl.textContent = `${formatNumber(data.gold18K)} ریال`;
                    goldSub.textContent = `نرخ تتر: ${formatNumber(data.usdtPrice)} ریال`;
                } else {
                    goldEl.textContent = '–';
                    goldSub.textContent = 'نرخ تتر: –';
                }

                // دلار (قیمت دلار = قیمت USDT)
                const dollarPrice = data.dollarPrice || data.usdtPrice || 0;
                if (dollarPrice > 0) {
                    dollarEl.textContent = `${formatNumber(dollarPrice)} ریال`;
                    dollarSub.textContent = 'نرخ USDT';
                } else {
                    dollarEl.textContent = '–';
                    dollarSub.textContent = 'نرخ USDT';
                }

                // کارت‌ها
                let html = '';
                ASSETS.forEach(a => {
                    const p = data.prices[a.symbol];
                    if (p && p.bestSell > 0) {
                        const change = p.change || 0;
                        const cls = getChangeClass(change);
                        const arrow = getChangeArrow(change);
                        html += `
                            <div class="price-card">
                                <div class="symbol">
                                    <span>${a.emoji} ${a.symbol}</span>
                                    <span class="change ${cls}">${getChangeEmoji(change)} ${arrow} ${Math.abs(change).toFixed(2)}%</span>
                                </div>
                                <div class="price-row">
                                    <span class="label">خرید</span>
                                    <span class="value buy">${formatNumber(p.bestBuy)}</span>
                                </div>
                                <div class="price-row">
                                    <span class="label">فروش</span>
                                    <span class="value sell">${formatNumber(p.bestSell)}</span>
                                </div>
                                <div class="last-price">
                                    ${formatNumber(p.lastPrice)} <small>ریال</small>
                                </div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="price-card" style="opacity:0.4;">
                                <div class="symbol">
                                    <span>${a.emoji} ${a.symbol}</span>
                                    <span class="change neutral">⏳</span>
                                </div>
                                <div style="text-align:center;padding:14px 0;color:rgba(255,255,255,0.25);font-size:0.8rem;">
                                    داده در دسترس نیست
                                </div>
                            </div>
                        `;
                    }
                });
                grid.innerHTML = html;
            }

            // ==========================================================
            // نمودار
            // ==========================================================
            function updateChart(history, symbol) {
                const canvas = document.getElementById('priceChart');
                if (!canvas) return;

                if (!history || history.length === 0) {
                    // داده‌های mock
                    history = generateMockHistory(symbol);
                }

                // استخراج داده‌ها
                let prices = [];
                let labels = [];

                if (symbol === 'GOLD') {
                    prices = history.map(h => h.GOLD18K || 0).filter(p => p > 0);
                    labels = history.map(h => new Date(h.time).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' }));
                } else if (symbol === 'DOLLAR') {
                    prices = history.map(h => h.DOLLAR || h.USDT || 0).filter(p => p > 0);
                    labels = history.map(h => new Date(h.time).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' }));
                } else {
                    prices = history.map(h => h[symbol] || 0).filter(p => p > 0);
                    labels = history.map(h => new Date(h.time).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' }));
                }

                // اگر داده‌ای نبود
                if (prices.length === 0) {
                    prices = [0];
                    labels = ['داده در دسترس نیست'];
                }

                const symbolNames = {
                    BTC: 'بیت‌کوین',
                    ETH: 'اتریوم',
                    USDT: 'تتر',
                    NOT: 'نات‌کوین',
                    GOLD: 'طلا (۱۸ عیار)',
                    DOLLAR: 'دلار'
                };
                document.getElementById('chartSymbol').textContent = symbolNames[symbol] || symbol;

                const colors = {
                    BTC: '#f7931a',
                    ETH: '#627eea',
                    USDT: '#26a17b',
                    NOT: '#a855f7',
                    GOLD: '#fbbf24',
                    DOLLAR: '#34d399'
                };
                const color = colors[symbol] || '#fbbf24';

                if (chartInstance) chartInstance.destroy();

                const ctx = canvas.getContext('2d');
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: symbol,
                            data: prices,
                            borderColor: color,
                            backgroundColor: color + '20',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 1.5,
                            pointBackgroundColor: color,
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return formatNumber(context.parsed.y) + ' ریال';
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: 'rgba(255,255,255,0.04)' },
                                ticks: {
                                    color: 'rgba(255,255,255,0.25)',
                                    font: { size: 9 },
                                    maxTicksLimit: 15
                                }
                            },
                            y: {
                                grid: { color: 'rgba(255,255,255,0.04)' },
                                ticks: {
                                    color: 'rgba(255,255,255,0.25)',
                                    font: { size: 9 },
                                    callback: function(value) {
                                        return formatNumber(value);
                                    }
                                }
                            }
                        }
                    }
                });
            }

            // ==========================================================
            // داده‌های mock (در صورت نبود تاریخچه)
            // ==========================================================
            function generateMockHistory(symbol) {
                const data = [];
                const now = Date.now();
                let basePrice = 0;
                switch (symbol) {
                    case 'BTC':
                        basePrice = 6400000000;
                        break;
                    case 'ETH':
                        basePrice = 425000000;
                        break;
                    case 'USDT':
                        basePrice = 58600;
                        break;
                    case 'NOT':
                        basePrice = 855;
                        break;
                    case 'GOLD':
                        basePrice = 12345000;
                        break;
                    case 'DOLLAR':
                        basePrice = 58600;
                        break;
                    default:
                        basePrice = 1000000;
                }
                for (let i = 0; i < 30; i++) {
                    const time = new Date(now - (29 - i) * 24 * 60 * 60 * 1000);
                    const variation = (Math.random() - 0.5) * 0.08;
                    const price = Math.round(basePrice * (1 + variation));
                    const entry = { time: time.toISOString() };
                    if (symbol === 'GOLD') entry.GOLD18K = price;
                    else if (symbol === 'DOLLAR') entry.DOLLAR = price;
                    else entry[symbol] = price;
                    data.push(entry);
                }
                return data;
            }

            // ==========================================================
            // بارگذاری داده‌ها
            // ==========================================================
            async function loadData() {
                const statusEl = document.getElementById('statusBar');
                statusEl.textContent = '⏳ در حال دریافت داده‌ها...';

                try {
                    // دریافت داده‌های لحظه‌ای
                    const latest = await fetchLatestData();

                    if (latest && latest.prices) {
                        const hasValidData = Object.values(latest.prices).some(p => p && p.bestSell > 0);
                        if (hasValidData) {
                            renderPrices(latest);
                        } else {
                            statusEl.textContent = '⚠️ داده‌های قیمت نامعتبر';
                            statusEl.style.color = 'rgba(251, 191, 36, 0.6)';
                        }
                    } else {
                        statusEl.textContent = '⚠️ داده‌ای در دسترس نیست';
                        statusEl.style.color = 'rgba(239, 68, 68, 0.7)';
                    }

                    // دریافت تاریخچه کامل برای نمودار
                    const history = await fetchAllHistory();
                    if (history && history.length > 0) {
                        fullHistory = history;
                        updateChart(history, currentChartSymbol);
                    } else {
                        // استفاده از داده‌های mock
                        const mock = generateMockHistory(currentChartSymbol);
                        fullHistory = mock;
                        updateChart(mock, currentChartSymbol);
                    }

                } catch (error) {
                    console.error('Error loading data:', error);
                    statusEl.textContent = '❌ خطا در دریافت داده‌ها';
                    statusEl.style.color = 'rgba(239, 68, 68, 0.7)';
                }
            }

            // ==========================================================
            // کنترل‌های نمودار
            // ==========================================================
            function setupChartControls() {
                const buttons = document.querySelectorAll('#chartControls button');
                buttons.forEach(btn => {
                    btn.addEventListener('click', function() {
                        buttons.forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        currentChartSymbol = this.dataset.symbol;
                        if (fullHistory && fullHistory.length > 0) {
                            updateChart(fullHistory, currentChartSymbol);
                        } else {
                            const mock = generateMockHistory(currentChartSymbol);
                            updateChart(mock, currentChartSymbol);
                        }
                    });
                });
            }

            // ==========================================================
            // اجرا
            // ==========================================================
            initParticles();
            loadData();
            setupChartControls();

            // بروزرسانی خودکار هر ۵ دقیقه
            setInterval(loadData, 5 * 60 * 1000);

            console.log('🚀 ArzPulse Dashboard loaded successfully');
        })();
    </script>

</body>
