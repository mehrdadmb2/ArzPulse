name: Keep Alive – Prevent Schedule Deactivation

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: arzpulse-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Create a weekly activity commit with push retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          attempt=1
          while [ "$attempt" -le 3 ]; do
            git commit --allow-empty -m "chore: scheduled repository keep-alive $(date -u '+%Y-%m-%d')"
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            git reset --hard origin/main
            attempt=$((attempt + 1))
            sleep $((attempt * 2))
          done
          echo "Keep-alive push failed after 3 attempts." >&2
          exit 1
