name: Update Market Data

on:
  schedule:
    - cron: '*/15 * * * *' # fail-safe backup; the Cloudflare Worker is the five-minute primary
  workflow_dispatch:
    inputs:
      reason:
        description: 'Optional reason for manual refresh'
        required: false
        type: string

# Shared across both workflows; prevents two workflows writing main at the same time.
concurrency:
  group: arzpulse-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Skip backup collection when the five-minute updater is healthy
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          age_seconds=$(node -e 'const fs=require("fs");let t=NaN;try{t=Date.parse(JSON.parse(fs.readFileSync("docs/data/latest.json","utf8")).timestamp||"")}catch{};process.stdout.write(String(Number.isFinite(t)?Math.floor((Date.now()-t)/1000):9999999))')
          echo "Latest snapshot age: ${age_seconds}s"
          if [ "$age_seconds" -ge 0 ] && [ "$age_seconds" -lt 420 ]; then
            echo "SKIP_COLLECTOR=true" >> "$GITHUB_ENV"
            echo "Skipping scheduled fallback because the Cloudflare updater refreshed data within the last seven minutes."
          fi

      - name: Collect market data and retry safe push
        if: env.SKIP_COLLECTOR != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "Collector/push attempt $attempt of 3"
            node scripts/fetch-and-save.js
            git add docs/data/latest.json docs/data/meta.json docs/data/history/
            if git diff --cached --quiet; then
              echo "No market data changes to commit."
              exit 0
            fi
            git commit -m "Auto-update prices $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            if git push origin HEAD:main; then
              echo "Market data pushed successfully."
              exit 0
            fi

            echo "Push was rejected; fetching latest remote main."
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Rebased and pushed successfully."
                exit 0
              fi
            fi

            echo "Conflict detected. Resetting this ephemeral runner to remote main and recollecting."
            git rebase --abort || true
            git reset --hard origin/main
            attempt=$((attempt + 1))
            sleep $((attempt * 2))
          done
          echo "Failed to push market data after 3 attempts." >&2
          exit 1
