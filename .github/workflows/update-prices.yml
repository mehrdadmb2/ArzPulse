name: Update Market Prices

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Optional reason for the update
        required: false
        default: scheduled
        type: string

permissions:
  contents: write

concurrency:
  group: arzpulse-price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect market data
        working-directory: scripts
        run: node fetch-and-save.js
      - name: Commit generated JSON data
        run: |
          git config user.name "ArzPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No generated data changes."
            exit 0
          fi
          git commit -m "chore(data): update market snapshot"
          git push
