name: Update Crypto Prices

on:
  schedule:
    # هر ۲ دقیقه یکبار
    - cron: '*/2 * * * *'
  # اجرای دستی
  workflow_dispatch:
  # اجرا بر روی هر push به شاخه main (برای تست)
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run fetch script
        run: node scripts/fetch-and-save.js
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/data/
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Auto-update prices $(date -u '+%Y-%m-%d %H:%M:%S')"
          git push
