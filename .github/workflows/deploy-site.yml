name: Build and Deploy Site to docs

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd site && npm ci
      - name: Build and Export
        run: cd site && npm run build && npm run export
        # خروجی در ../docs ذخیره می‌شود (طبق next.config.js)
      - name: Commit and push docs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/
          git diff --staged --quiet || git commit -m "Deploy site to docs $(date -u '+%Y-%m-%d %H:%M:%S')"
          git push
